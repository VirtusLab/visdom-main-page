# DISABLED in the GitHub UI since 2026-08-11. Do not expect a push to dev to
# publish anything until someone re-enables it.
#
# Why: `npm ci` fails with 401 fetching @virtuslab/visdom-ui from GitHub
# Packages. The PACKAGES_READ_TOKEN secret exists but the PAT behind it stopped
# authenticating, so this last deployed successfully on 2026-06-25 and every run
# after that failed. The workflow itself is fine; only the credential is not.
#
# To bring it back, fix the credential and then `gh workflow enable deploy.yml`:
#   - preferred: grant the visdom-main-page repo read access in the
#     @virtuslab/visdom-ui package settings, so the default GITHUB_TOKEN is
#     enough and the secret can be deleted. Nothing expires that way.
#   - or: mint a new classic PAT with read:packages and
#     `gh secret set PACKAGES_READ_TOKEN`.
#
# Production is unaffected either way: visdom.virtuslab.com is deployed by
# Vercel on push to master, outside GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
        env:
          # The project .npmrc authenticates GitHub Packages via ${GITHUB_TOKEN}; the
          # default GITHUB_TOKEN cannot read the cross-repo @virtuslab/visdom-ui package,
          # so feed it from PACKAGES_READ_TOKEN (classic PAT, read:packages).
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run build
        env:
          SITE: https://virtuslab.github.io
          BASE: /visdom-main-page
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
